# =============================================================================
# Release workflow — runner-base
#
# PURPOSE
# -------
# Publish an immutable container image based on an explicitly validated
# Semantic Version tag.
#
# This workflow:
# - validates the release tag format (strict SemVer)
# - binds the image to an exact git commit
# - performs a minimal runtime smoke check
# - publishes a fully identifiable and auditable artifact
#
# This file is part of the platform contract.
# Any modification MUST be reviewed as a breaking change.
# =============================================================================

name: Release image


# -----------------------------------------------------------------------------
# Trigger configuration
#
# The workflow is triggered exclusively by git tags
# matching the pattern: vMAJOR.MINOR.PATCH
#
# Examples:
#   v0.1.0   → valid
#   v1.2.3   → valid
#   v1.0     → INVALID
#   v1.0.0-rc1 → INVALID
# -----------------------------------------------------------------------------

on:
  push:
    tags:
      - 'v*'


# -----------------------------------------------------------------------------
# Permissions
#
# Minimal permissions required for publishing to GHCR.
# -----------------------------------------------------------------------------

permissions:
  contents: write
  packages: write
  attestations: write
  id-token: write

concurrency:
  group: runner-base-release
  cancel-in-progress: false


# -----------------------------------------------------------------------------
# Jobs
# -----------------------------------------------------------------------------

jobs:

  # ===========================================================================
  # Release job
  #
  # Purpose:
  # - Build the container image for the tagged version
  # - Validate basic runtime behavior
  # - Publish the image to the container registry
  # ===========================================================================

  release:
    name: Build, validate, and publish image
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:

      # -----------------------------------------------------------------------
      # Checkout source
      #
      # The repository is checked out exactly at the tagged commit.
      # No branch state is involved.
      # -----------------------------------------------------------------------

      - name: Checkout source at tag
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0


      # -----------------------------------------------------------------------
      # Validate release tag (strict SemVer)
      #
      # Accepted format:
      #   vMAJOR.MINOR.PATCH
      #
      # Any deviation fails the workflow.
      # -----------------------------------------------------------------------

      - name: Validate release tag (SemVer)
        id: semver
        shell: bash
        run: |
          set -Eeuo pipefail

          TAG="${GITHUB_REF#refs/tags/}"

          if [[ ! "$TAG" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "ERROR: Invalid release tag '$TAG'"
            echo "Expected format: vMAJOR.MINOR.PATCH (e.g. v1.2.3)"
            exit 1
          fi

          MAJOR="${BASH_REMATCH[1]}"
          MINOR="${BASH_REMATCH[2]}"
          PATCH="${BASH_REMATCH[3]}"

          VERSION="${MAJOR}.${MINOR}.${PATCH}"
          VERSION_MM="${MAJOR}.${MINOR}"
          COMMIT_SHA="$(git rev-parse HEAD)"

          {
            echo "tag=${TAG}"
            echo "version=${VERSION}"
            echo "version_mm=${VERSION_MM}"
            echo "commit=${COMMIT_SHA}"
          } >> "${GITHUB_OUTPUT}"


      # -----------------------------------------------------------------------
      # Ensure tag is on main
      # -----------------------------------------------------------------------

      - name: Ensure tag is on main
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch origin main
          [[ "$(git rev-parse HEAD)" == "$(git rev-parse origin/main)" ]] || {
            echo "ERROR: release tag must point exactly at origin/main HEAD" >&2
            exit 1
          }
          current_version="${{ steps.semver.outputs.version }}"
          highest="$(git tag --list 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | grep -vx "${{ steps.semver.outputs.tag }}" | sort -V | tail -n 1 || true)"
          if [[ -n "${highest}" ]] && [[ "$(printf '%s\n%s\n' "${highest#v}" "${current_version}" | sort -V | tail -n 1)" != "${current_version}" ]]; then
            echo "ERROR: release version must be higher than ${highest}" >&2
            exit 1
          fi

      - name: Prepare tag-bound release build context
        shell: bash
        env:
          TAG: ${{ steps.semver.outputs.tag }}
          COMMIT: ${{ steps.semver.outputs.commit }}
        run: |
          set -Eeuo pipefail
          rm -rf release-context
          mkdir release-context
          git archive --format=tar HEAD | tar -x -C release-context
          python3 ci/prepare-release-manifest.py \
            --input image.manifest \
            --output release-context/image.manifest \
            --tag "${TAG}" \
            --revision "${COMMIT}"




      # -----------------------------------------------------------------------
      # Define Docker image metadata
      #
      # OCI labels provide full artifact traceability:
      # - source repository
      # - exact commit hash
      # - build timestamp
      # -----------------------------------------------------------------------

      - name: Define Docker image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            ghcr.io/gehorak/runner-base
          tags: |
            type=raw,value=${{ steps.semver.outputs.version }}
            type=raw,value=${{ steps.semver.outputs.version_mm }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=runner-base
            org.opencontainers.image.description=Deterministic base runner image
            org.opencontainers.image.source=https://github.com/gehorak/runner-base
            org.opencontainers.image.version=${{ steps.semver.outputs.version }}
            org.opencontainers.image.revision=${{ steps.semver.outputs.commit }}
            org.opencontainers.image.base.name=debian:bookworm-slim
            org.opencontainers.image.base.digest=sha256:60eac759739651111db372c07be67863818726f754804b8707c90979bda511df


      # -----------------------------------------------------------------------
      # Authenticate to GitHub Container Registry
      # -----------------------------------------------------------------------

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Inspect immutable release recovery state
        id: existing-release
        shell: bash
        env:
          VERSION: ${{ steps.semver.outputs.version }}
        run: |
          set -Eeuo pipefail
          reference="ghcr.io/gehorak/runner-base:${VERSION}"
          existing_config_digest="absent"
          if docker manifest inspect "${reference}" >/dev/null 2>&1; then
            raw_manifest="$(docker buildx imagetools inspect --raw "${reference}")"
            existing_config_digest="$(printf '%s' "${raw_manifest}" | python3 -c 'import json, sys; print(json.load(sys.stdin)["config"]["digest"])')"
          fi
          echo "config_digest=${existing_config_digest}" >> "${GITHUB_OUTPUT}"


      # -----------------------------------------------------------------------
      # Build image locally
      #
      # The image is built locally first to allow validation
      # before publication.
      # -----------------------------------------------------------------------

      - name: Build tested release image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: release-context
          load: true
          platforms: linux/amd64
          tags: |
            runner-release:test
            ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Prepare release artifacts and validate actual candidate identity
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p release-artifacts
          python3 ci/validate-image-identity.py \
            --image runner-release:test \
            --runner-version "${{ steps.semver.outputs.version }}" \
            --image-version "${{ steps.semver.outputs.version }}" \
            --image-revision "${{ steps.semver.outputs.commit }}" \
            --output release-artifacts/actual-image-identity.json


      # -----------------------------------------------------------------------
      # Minimal runtime smoke check
      #
      # Verifies:
      # - the image can be started
      # - the runner entrypoint responds
      #
      # This is intentionally NOT a full test suite.
      # Exhaustive validation is handled by CI.
      # -----------------------------------------------------------------------

      - name: Smoke test image
        shell: bash
        run: |
          set -Eeuo pipefail
          docker run --rm runner-release:test info > /dev/null


      # -----------------------------------------------------------------------
      # Full contract validation (CI invariant)
      #
      # Release MUST re-validate the full runner contract.
      # Publishing without passing the full test suite is forbidden.
      # -----------------------------------------------------------------------

      - name: Run complete base-owned test suite on the built release image
        shell: bash
        env:
          IMAGE: runner-release:test
        run: |
          set -Eeuo pipefail
          bash ci/run-base-tests.sh

      - name: Scan exact tested release candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          docker image save runner-release:test --output release-artifacts/runner-release.test.tar
          docker run --rm --volume "${PWD}:/work:ro" aquasec/trivy@sha256:6fb0646988fcd2fdf7bf123f7174945ebc2c9c72d1fa1567c8d7daeeb70f8037 image --input /work/release-artifacts/runner-release.test.tar --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1

      - name: Generate SPDX SBOM for tested image
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: runner-release:test
          format: spdx-json
          output-file: release-artifacts/runner-base-${{ steps.semver.outputs.version }}.sbom.spdx.json
          artifact-name: runner-base-${{ steps.semver.outputs.version }}.sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false
          syft-version: v1.46.0


      # -----------------------------------------------------------------------
      # Publish or resume the immutable SemVer image
      #
      # Executed only after successful build and validation.
      # The pushed tags all reference the same locally tested image.
      # -----------------------------------------------------------------------

      - name: Publish or resume immutable tested image
        id: publication
        shell: bash
        env:
          VERSION: ${{ steps.semver.outputs.version }}
          EXISTING_CONFIG_DIGEST: ${{ steps.existing-release.outputs.config_digest }}
        run: |
          set -Eeuo pipefail
          candidate_config_digest="$(docker image inspect runner-release:test --format '{{.Id}}')"
          mode="$(python3 ci/release-publication-state.py \
            --existing-config-digest "${EXISTING_CONFIG_DIGEST}" \
            --candidate-config-digest "${candidate_config_digest}")"
          immutable_reference="ghcr.io/gehorak/runner-base:${VERSION}"
          if [[ "${mode}" == publish ]]; then
            docker image tag runner-release:test "${immutable_reference}"
            docker image push "${immutable_reference}"
          fi
          echo "mode=${mode}" >> "${GITHUB_OUTPUT}"


      # -----------------------------------------------------------------------
      # Release evidence, SBOM, and keyless attestations
      # -----------------------------------------------------------------------

      - name: Resolve published and rollback digests
        id: digests
        shell: bash
        env:
          TAG: ${{ steps.semver.outputs.tag }}
          VERSION: ${{ steps.semver.outputs.version }}
        run: |
          set -Eeuo pipefail

          published_reference="ghcr.io/gehorak/runner-base:${VERSION}"
          published_digest="sha256:$(docker buildx imagetools inspect --raw "${published_reference}" | sha256sum | cut -d ' ' -f 1)"

          previous_tag=""
          IFS='.' read -r current_major current_minor current_patch <<< "${VERSION}"
          while IFS= read -r candidate; do
            [[ "${candidate}" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]] || continue
            candidate_major="${BASH_REMATCH[1]}"
            candidate_minor="${BASH_REMATCH[2]}"
            candidate_patch="${BASH_REMATCH[3]}"
            if (( candidate_major < current_major )) \
              || (( candidate_major == current_major && candidate_minor < current_minor )) \
              || (( candidate_major == current_major && candidate_minor == current_minor && candidate_patch < current_patch )); then
              previous_tag="${candidate}"
              break
            fi
          done < <(git tag --merged HEAD --list 'v*' --sort=-version:refname)
          [[ -n "${previous_tag}" ]] || {
            echo "ERROR: no prior strict SemVer tag is available for rollback evidence" >&2
            exit 1
          }

          previous_reference="ghcr.io/gehorak/runner-base:${previous_tag#v}"
          previous_digest="sha256:$(docker buildx imagetools inspect --raw "${previous_reference}" | sha256sum | cut -d ' ' -f 1)"

          {
            echo "published_reference=${published_reference}"
            echo "published_digest=${published_digest}"
            echo "previous_reference=${previous_reference}"
            echo "previous_digest=${previous_digest}"
          } >> "${GITHUB_OUTPUT}"

      - name: Attest published image provenance
        id: attest-provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/gehorak/runner-base
          subject-digest: ${{ steps.digests.outputs.published_digest }}
          push-to-registry: true
          create-storage-record: false

      - name: Attest published image SBOM
        id: attest-sbom
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/gehorak/runner-base
          subject-digest: ${{ steps.digests.outputs.published_digest }}
          sbom-path: release-artifacts/runner-base-${{ steps.semver.outputs.version }}.sbom.spdx.json
          push-to-registry: true
          create-storage-record: false

      - name: Write and validate release evidence
        shell: bash
        env:
          RUNNER_RELEASE_EVIDENCE_OUTPUT: release-artifacts/runner-base-${{ steps.semver.outputs.version }}.release-evidence.json
          RUNNER_RELEASE_SOURCE_COMMIT: ${{ steps.semver.outputs.commit }}
          RUNNER_RELEASE_TAG: ${{ steps.semver.outputs.tag }}
          RUNNER_RELEASE_PUBLISHED_REFERENCE: ${{ steps.digests.outputs.published_reference }}
          RUNNER_RELEASE_PUBLISHED_DIGEST: ${{ steps.digests.outputs.published_digest }}
          RUNNER_RELEASE_SBOM_REFERENCE: runner-base-${{ steps.semver.outputs.version }}.sbom.spdx.json
          RUNNER_RELEASE_PROVENANCE_REFERENCE: ${{ steps.attest-provenance.outputs.attestation-url }}
          RUNNER_RELEASE_PREVIOUS_REFERENCE: ${{ steps.digests.outputs.previous_reference }}
          RUNNER_RELEASE_PREVIOUS_DIGEST: ${{ steps.digests.outputs.previous_digest }}
        run: |
          set -Eeuo pipefail
          RUNNER_RELEASE_CANDIDATE_IMAGE_ID="$(docker image inspect runner-release:test --format '{{.Id}}')"
          RUNNER_RELEASE_ACTUAL_IDENTITY_FILE=release-artifacts/actual-image-identity.json
          RUNNER_RELEASE_TESTS="$(bash ci/run-base-tests.sh --list | paste -sd, -)"
          RUNNER_RELEASE_PARENT_REFERENCE="$(python3 ci/parent-reference.py --field reference)"
          RUNNER_RELEASE_PARENT_DIGEST="$(python3 ci/parent-reference.py --field digest)"
          export RUNNER_RELEASE_CANDIDATE_IMAGE_ID
          export RUNNER_RELEASE_ACTUAL_IDENTITY_FILE RUNNER_RELEASE_TESTS RUNNER_RELEASE_PARENT_REFERENCE RUNNER_RELEASE_PARENT_DIGEST
          python3 ci/write-release-evidence.py
          python3 ci/validate-release-evidence.py "${RUNNER_RELEASE_EVIDENCE_OUTPUT}"

      - name: Publish release evidence assets
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
        with:
          generate_release_notes: true
          files: |
            release-artifacts/runner-base-${{ steps.semver.outputs.version }}.release-evidence.json
            release-artifacts/runner-base-${{ steps.semver.outputs.version }}.sbom.spdx.json
          fail_on_unmatched_files: true

      - name: Publish convenience aliases after immutable evidence
        shell: bash
        env:
          VERSION_MM: ${{ steps.semver.outputs.version_mm }}
          PUBLISHED_DIGEST: ${{ steps.digests.outputs.published_digest }}
        run: |
          set -Eeuo pipefail
          for alias in "${VERSION_MM}" latest; do
            reference="ghcr.io/gehorak/runner-base:${alias}"
            docker image tag runner-release:test "${reference}"
            docker image push "${reference}"
            observed_digest="sha256:$(docker buildx imagetools inspect --raw "${reference}" | sha256sum | cut -d ' ' -f 1)"
            [[ "${observed_digest}" == "${PUBLISHED_DIGEST}" ]] || {
              echo "ERROR: convenience alias ${alias} does not match the immutable published digest" >&2
              exit 1
            }
          done

# -----------------------------------------------------------------------------
# End of workflow
#
# CONTRACT GUARANTEES
# -------------------
# - Only valid SemVer tags can produce a release.
# - Every published image is traceable to a specific commit.
# - A runnable image is verified before publication.
# - No image is published implicitly from any branch.
# =============================================================================
