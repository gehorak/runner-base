name: Derived conformance

on:
  workflow_call:
    inputs:
      image:
        description: Local image name used for the derived build and tests.
        required: true
        type: string
      build_context:
        description: Derived Docker build context relative to the caller repository root.
        required: true
        type: string
      dockerfile:
        description: Derived Dockerfile relative to the caller repository root.
        required: true
        type: string
      base_reference:
        description: Immutable released runner-base SemVer and digest reference adopted by the derived image.
        required: true
        type: string
      expected_contract_version:
        description: Runner conformance version expected by the derived image.
        required: true
        type: string
      conformance_ref:
        description: Full runner-base commit SHA that supplies the conformance bundle.
        required: true
        type: string
      tools_lock_path:
        description: Derived tools.lock JSON path relative to the caller repository root.
        required: true
        type: string
      domain_test_path:
        description: Derived explicit shell test path relative to the caller repository root.
        required: true
        type: string

permissions:
  contents: read

jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - name: Validate conformance ref
        shell: bash
        env:
          INPUT_CONFORMANCE_REF: ${{ inputs.conformance_ref }}
        run: |
          set -Eeuo pipefail
          [[ "${INPUT_CONFORMANCE_REF}" =~ ^[0-9a-f]{40}$ ]] || { echo 'ERROR: conformance_ref must be a full immutable commit SHA' >&2; exit 1; }
      - name: Checkout derived source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Checkout pinned Runner conformance bundle
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: gehorak/runner-base
          ref: ${{ inputs.conformance_ref }}
          path: runner-base-contract
          persist-credentials: false
      - name: Build derived image from the declared immutable parent
        shell: bash
        env:
          INPUT_BASE_REFERENCE: ${{ inputs.base_reference }}
          INPUT_BUILD_CONTEXT: ${{ inputs.build_context }}
          INPUT_DOCKERFILE: ${{ inputs.dockerfile }}
          INPUT_IMAGE: ${{ inputs.image }}
        run: |
          set -Eeuo pipefail
          docker build --build-arg "BASE_IMAGE=${INPUT_BASE_REFERENCE}" --file "${INPUT_DOCKERFILE}" --tag "${INPUT_IMAGE}" "${INPUT_BUILD_CONTEXT}"
      - name: Run pinned Runner base conformance
        shell: bash
        env:
          INPUT_BASE_REFERENCE: ${{ inputs.base_reference }}
          INPUT_CONFORMANCE_REF: ${{ inputs.conformance_ref }}
          INPUT_DOMAIN_TEST_PATH: ${{ inputs.domain_test_path }}
          INPUT_EXPECTED_CONTRACT_VERSION: ${{ inputs.expected_contract_version }}
          INPUT_IMAGE: ${{ inputs.image }}
          INPUT_TOOLS_LOCK_PATH: ${{ inputs.tools_lock_path }}
        run: |
          set -Eeuo pipefail
          [[ "$(git -C runner-base-contract rev-parse HEAD)" == "${INPUT_CONFORMANCE_REF}" ]] || { echo 'ERROR: checked-out conformance bundle does not match the requested commit' >&2; exit 1; }
          bash runner-base-contract/ci/derived-conformance.sh \
            --image "${INPUT_IMAGE}" \
            --base-reference "${INPUT_BASE_REFERENCE}" \
            --contract-version "${INPUT_EXPECTED_CONTRACT_VERSION}" \
            --tools-lock "${INPUT_TOOLS_LOCK_PATH}" \
            --domain-test "${INPUT_DOMAIN_TEST_PATH}"
