name: Scan latest published release

on:
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  packages: read
  security-events: write

jobs:
  scan:
    name: Scan immutable published digest
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source for report locations
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Resolve the latest released immutable SemVer digest
        id: target
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          tag="$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq .tag_name)"
          [[ "${tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "ERROR: latest GitHub Release tag is not strict SemVer: ${tag}" >&2; exit 1; }
          reference="ghcr.io/gehorak/runner-base:${tag#v}"
          digest="sha256:$(docker buildx imagetools inspect --raw "${reference}" | sha256sum | cut -d ' ' -f 1)"
          printf 'reference=%s\ndigest=%s\n' "${reference}" "${digest}" > scan-target.txt
          cat scan-target.txt >> "${GITHUB_STEP_SUMMARY}"
          {
            echo "reference=${reference}"
            echo "digest=${digest}"
          } >> "${GITHUB_OUTPUT}"
      - name: Scan the exact published digest
        shell: bash
        env:
          REFERENCE: ${{ steps.target.outputs.reference }}
          DIGEST: ${{ steps.target.outputs.digest }}
        run: |
          set -Eeuo pipefail
          docker run --rm --volume "${PWD}:/work" aquasec/trivy:0.71.0@sha256:016eae51fdcf989332a5404af7e8f625cd5d95d7c0907a221d080a996f556500 \
            image "${REFERENCE}@${DIGEST}" --scanners vuln \
            --format sarif --output /work/trivy.sarif
      - name: Enforce the release vulnerability gate
        shell: bash
        env:
          REFERENCE: ${{ steps.target.outputs.reference }}
          DIGEST: ${{ steps.target.outputs.digest }}
        run: |
          set -Eeuo pipefail
          docker run --rm aquasec/trivy:0.71.0@sha256:016eae51fdcf989332a5404af7e8f625cd5d95d7c0907a221d080a996f556500 \
            image "${REFERENCE}@${DIGEST}" --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1
      - name: Publish vulnerability report to GitHub Security
        if: ${{ !cancelled() && hashFiles('trivy.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: trivy.sarif
          category: trivy-published-image
